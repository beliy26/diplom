server {
    listen 80;

    # Файлы сайта (собранный React)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Разрешаем загружать файлы до 10 МБ (по умолчанию в nginx только 1 МБ)
    client_max_body_size 10M;

    # Все запросы на /api отправляем в контейнер с бэкендом
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Загруженные фото товаров тоже отдаёт бэкенд
    location /uploads/ {
        proxy_pass http://backend:8000;
    }
}
